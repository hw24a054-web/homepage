<!DOCTYPE html>
<html lang="ja">

<head>

    <link rel="stylesheet" href="style.css">

<body>

    <header class="estimate-header">

    <main>

            <div class="price-table-wrapper">

                <table class="price-table">

                    <thead>
                        <tr>
                            <th>広さ</th>
                            <th>料金</th>
                            <th>所要時間</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>25㎡未満</td>

                            <td>1時間</td>

                        </tr>

                        <tr>
                            <td>25~35㎡</td>
                            <td>14,800円</td>
                            <td>1時間</td>
                        </tr>

                        <tr>
                            <td>36~45㎡</td>
                            <td>19,800円</td>
                            </td>1.5時間</td>
                        </tr>

                        <tr>
                            <td>46~55㎡</td>
                            <td>24,000円</td>
                            </td>2時間</td>
                        </tr>

                        <!-- ここに追加を書く -->


                    </tbody>

                </table>

            </div>

        </section>
    </main>

    <footer>
        <p>© 2026</p>
    </footer>
